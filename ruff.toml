# src/config/opencv_js.config.py is the upstream OpenCV whitelist copied verbatim, with
# four deliberate changes (the header comment, dnn removed, mulSpectrums / SVDecomp added
# to core, the mcc entries renamed). Formatting it would destroy the comparison with
# upstream: when moving to a new version, the diff would drown in style changes and hide
# the real whitelist changes.
#
# This is not hypothetical: when the file was added on 2026-07-27, a global ruff format
# hook rewrote upstream's compact style (a dozen names per line, single quotes, hand
# alignment) into ruff's default (double quotes, one element per line), and the diff
# covered the whole file. It was saved by reverting.
#
# Self-check (needs nothing uncommitted from this repository):
#   curl -sL https://raw.githubusercontent.com/opencv/opencv/$(tr -d '[:space:]' \
#     < build/opencv-version.txt)/platforms/js/opencv_js.config.py \
#     | diff - src/config/opencv_js.config.py
# The expected differences are exactly these: the header comment block added here, the
# core line with 'mulSpectrums', 'SVDecomp' next to dft, the three mcc entries in
# objdetect, and makeWhiteList([...]) at the end without dnn. Any other difference means
# the file was formatted (or upstream changed the whitelist, which needs a human look).
#
# force-exclude is required: without it ruff ignores exclude for paths passed explicitly,
# and formatting hooks pass paths explicitly.
extend-exclude = ["src/config/opencv_js.config.py"]
force-exclude = true
