name: Build WASM

on:
  # Release tags build automatically. Anything else is dispatched by hand: ci.yml asks for
  # a dispatch when no artifacts match the current build inputs.
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serializes the whole workflow so two builds never burn CI time at once.
#
# The group must be a constant: with `build-wasm-${{ github.ref }}`, two different tags or
# branches land in two groups and still run concurrently — only repeated triggers on the
# same ref would be serialized, which does not prevent what this is meant to prevent.
#
# cancel-in-progress: false (not true) because cancelling a build halfway is just as
# wasteful; waiting for it to finish is cheaper.
#
# This is **workflow-level**: it applies to the whole run, not to single jobs. The three
# matrix jobs belong to one run and share one concurrency slot, so **they neither queue
# behind nor cancel each other** — they still run in parallel. Moving concurrency to the
# job level would serialize the matrix, which is exactly what must not happen.
#
# Cost: one run is three parallel builds, so the wall-clock time stays that of one build
# while the CI minutes triple. That is the price of two npm variants plus the single-file
# variant.
concurrency:
  group: build-wasm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A build took about 11 minutes in CI with emsdk 3.1.64, and takes 3–4 minutes locally
    # with 6.0.12; 45 leaves room without letting a hung build burn hours.
    timeout-minutes: 45
    strategy:
      # fail-fast: false: one failing variant must not cancel the other two. They are
      # independent, and when one fails, the other two are exactly the comparison needed.
      fail-fast: false
      matrix:
        include:
          # baseline is the required fallback for engines without WebAssembly SIMD
          # (Chrome < 91, Firefox < 89, Safari < 16.4).
          - variant: baseline
            flag: ""
            single_file: "0"
          - variant: simd
            flag: "--simd"
            single_file: "0"
          # The single-file variant is only uploaded as an artifact and is **not in the npm
          # package** (build/assemble.sh assembles the other two and rejects glue over
          # 2 MB). It is meant for a direct browser <script> include.
          - variant: singlefile
            flag: "--single-file"
            single_file: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the ${{ matrix.variant }} wasm
        env:
          FLAG: ${{ matrix.flag }}
        # An if rather than `./build/build.sh $FLAG`: baseline's flag is empty, which only
        # disappears unquoted by relying on word splitting, while quoting it passes an empty
        # argument. Explicit branches leave no ambiguity.
        run: |
          if [ -n "$FLAG" ]; then
            ./build/build.sh "$FLAG"
          else
            ./build/build.sh
          fi

      - name: Report sizes
        env:
          VARIANT: ${{ matrix.variant }}
        # Lists what is actually in the directory instead of hard-coding opencv.js +
        # opencv_js.wasm: the single-file variant has one file, and hard-coding would fail
        # this step for that matrix entry.
        run: |
          cd "build/out/$VARIANT"
          for f in *; do
            raw=$(stat -c%s "$f")
            gz=$(gzip -c "$f" | wc -c)
            br=$(brotli -c "$f" | wc -c)
            printf '%-16s raw %9s  gzip %9s  brotli %9s\n' "$f" "$raw" "$gz" "$br"
          done

      - name: Smoke test
        # node:test's timeout option does not guarantee the process exits: it only reports
        # the test as failed at the deadline, and if live async handles keep the event loop
        # busy (likely when a real wasm load hangs), the node --test process keeps running.
        # --test-force-exit stops the process; this timeout-minutes is a second backstop
        # that does not depend on Node at all (the runner kills the whole process tree).
        # Each covers for the other.
        timeout-minutes: 5
        env:
          OPENCV_ARTIFACT: ${{ github.workspace }}/build/out/${{ matrix.variant }}
          # "This run must really test." Without OPENCV_ARTIFACT the smoke test skips and
          # exits 0, which would report the build green with zero verification; with this
          # variable the test file throws instead of skipping.
          # Not process.env.CI: ci.yml's `npm test` also runs in CI and globs the same file,
          # and that pipeline has no artifact to smoke-test.
          OPENCV_SMOKE_REQUIRED: "1"
          # The artifact's shape flips with the variant: the single-file variant has no
          # separate .wasm and its glue must exceed 2 MB. An explicit variable rather than
          # letting the test guess ("is there a .wasm in the directory?" would take a split
          # build that lost its .wasm for a single-file one and report green).
          OPENCV_SMOKE_SINGLE_FILE: ${{ matrix.single_file }}
        # The first guard is in the shell and does not depend on Node: with OPENCV_ARTIFACT
        # unset or missing, `test -d ""` is false and the step fails right away.
        run: |
          test -d "$OPENCV_ARTIFACT" || { echo "::error::OPENCV_ARTIFACT is unset or not a directory: '$OPENCV_ARTIFACT'"; exit 1; }
          ls test/smoke/*.test.js >/dev/null
          node --test --test-force-exit test/smoke/*.test.js

      # The artifact name carries the build-input fingerprint; ci.yml looks artifacts up
      # by it (see build/fingerprint.sh).
      - name: Fingerprint the build inputs
        id: fp
        if: always()
        run: echo "value=$(build/fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        # if: always(): when the smoke test fails, that artifact is exactly what is needed to
        # investigate. Without it the upload is skipped after a failed step and the artifact
        # disappears with the runner, so seeing it again takes a whole new build.
        # If the build step itself failed the directory may not exist; upload-artifact then
        # defaults to if-no-files-found: warn, which warns without failing the job and does
        # not hide the real failure.
        if: always()
        with:
          name: opencv-wasm-${{ matrix.variant }}-${{ steps.fp.outputs.value }}
          path: build/out/${{ matrix.variant }}/
          retention-days: 30

  # Variant parity, checked here as well as in ci.yml: a SIMD variant that computes wrong
  # results fails the run that built it, before ci.yml ever selects its artifacts. The run
  # that produced the artifacts answers for them.
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fingerprint the build inputs
        id: fp
        run: echo "value=$(build/fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: opencv-wasm-baseline-${{ steps.fp.outputs.value }}
          path: build/out/baseline

      - uses: actions/download-artifact@v8
        with:
          name: opencv-wasm-simd-${{ steps.fp.outputs.value }}
          path: build/out/simd

      - name: Assemble dist/ (both variants)
        env:
          # A missing simd artifact fails instead of warning: this pipeline is supposed to
          # have both variants, and verifying a baseline-only dist/ would be another lying
          # green light.
          OPENCV_REQUIRE_SIMD: "1"
        run: npm run assemble

      - name: Test (forced baseline) + variant parity
        env:
          OPENCV_SIMD: "0"
          # The parity test skips when dist/simd/ is missing; here it must really run.
          OPENCV_PARITY_REQUIRED: "1"
        run: npm test

      - name: Test (forced simd, the same assertions again)
        env:
          # A variant named explicitly that is missing makes dist/index.js throw instead of
          # falling back to baseline — which guarantees this step really tests the SIMD
          # artifact, not baseline in disguise.
          OPENCV_SIMD: "1"
        run: npm test

      - name: Measured SIMD speedup (report only, not a gate)
        # No continue-on-error needed, and "something got slower" does not block the job:
        # test/simd-compare.js deliberately passes no verdict on speedups and only exits 1
        # when it fails to run. SIMD does not win everywhere — upstream's 2020 per-kernel
        # data has blur CV_32FC1 at 0.519x — and a "SIMD must be faster" gate would only
        # end with someone deleting it or measuring only favourable operations. This step
        # produces numbers, not verdicts.
        run: npm run simd:compare
