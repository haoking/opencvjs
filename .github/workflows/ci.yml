name: CI

on:
  push:
    branches: [master, rebuild-2.0]
  pull_request:

# gh run list/download 要读别的 workflow 的运行记录与产物。
permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 测试栈零依赖，无需 npm install

      # 2.0 起测试跑在**组装后的 dist/** 上（wasm 产物 + src/js/ 扩展层），
      # 而 wasm 产物不入 git。这里取 build-wasm.yml 最近一次成功运行上传的那份
      # ——也正是被那条 workflow 的冒烟测试验过的同一份产物。
      #
      # 不在这里现场构建：build/build.sh 要跑 Docker + 完整 OpenCV 编译（实测
      # 10.8 分钟），乘以 3 个 Node 版本、每次 push 都跑，代价与收益不成比例。
      #
      # 失败模式是显式的：产物有 30 天保留期，超期或从未构建过时下面这步直接
      # 报错退出（而不是让测试静默地一项都不跑）。届时手动触发一次
      # build-wasm.yml（workflow_dispatch）即可恢复。
      - name: 取回最近一次成功构建的 wasm 产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow build-wasm.yml --status success \
                     --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::找不到 build-wasm.yml 的成功运行——手动触发一次以产出 wasm 产物"
            exit 1
          fi
          echo "使用 build-wasm 运行 #$run_id 的产物"
          # 两个变体都要取。--status success 是整趟 run 的结论，而 build-wasm.yml
          # 的矩阵是 fail-fast: false ——任一变体失败都会把整个 run 判为 failure，
          # 所以「success」这个筛选条件已经蕴含了三个变体全部成功。
          # 单文件变体（opencv-wasm-singlefile）刻意不取：它不进 npm 包，
          # build/assemble.sh 也会拒绝把内联了 wasm 的 glue 组装进 dist/。
          gh run download "$run_id" --name opencv-wasm-baseline --dir build/out/baseline
          gh run download "$run_id" --name opencv-wasm-simd --dir build/out/simd
          ls -la build/out/baseline build/out/simd

      - name: 组装 dist/
        env:
          # 缺 simd 时从「警告并继续」升级为「直接失败」：这条链路本来就该有两个
          # 变体，组装出一份只有 baseline 的 dist/ 然后照常报绿，就是会说谎的绿灯。
          OPENCV_REQUIRE_SIMD: "1"
        run: npm run assemble

      # 同一套断言在两个变体上各跑一遍。这是「SIMD 版本没算错」的主要保证：
      # 变体选择由 OPENCV_SIMD 强制，而被显式点名的变体若不存在，dist/index.js
      # 会抛错而不是悄悄回落——否则「强制 SIMD 跑一遍」可能实际测的是 baseline。
      - name: 运行测试（强制 baseline）+ 双产物一致性
        env:
          OPENCV_SIMD: "0"
          # 一致性测试在 dist/simd/ 缺失时默认跳过；这里声明「必须真跑」。
          # 只挂在这一步上，跑一遍就够——它内部是子进程加载两个变体做对比，
          # 与外层 OPENCV_SIMD 取什么值无关。
          OPENCV_PARITY_REQUIRED: "1"
        run: npm test

      - name: 运行测试（强制 simd）
        env:
          OPENCV_SIMD: "1"
        run: npm test

      - name: 性能门禁
        # 只在一个 Node 版本上跑，避免 CI runner 抖动导致误报。
        # 钉在 baseline 上：两个门禁比的都是「被测实现 vs 同进程内的参照实现」，
        # 用哪个变体跑都成立，但钉死一个变体才能让历次运行打印的绝对毫秒数可比。
        if: matrix.node == '22'
        env:
          OPENCV_SIMD: "0"
        run: npm run bench
