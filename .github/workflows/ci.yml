name: CI

on:
  push:
    branches: [master]
  pull_request:

# gh api / gh run download read another workflow's runs and artifacts.
permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level backstop. GitHub's default is 360 minutes: any hung step (say, a child
    # process stuck in wasm initialization) would hold the whole matrix for 6 hours. A
    # normal run takes a few minutes.
    timeout-minutes: 30
    strategy:
      matrix:
        # The three supported lines: 22 (maintenance LTS, EOL 2027-04-30), 24 (LTS) and
        # 26 (LTS from 2026-10-28). 18 and 20 reached EOL on 2025-04-30 and 2026-04-30.
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The test stack has no dependencies, so there is no npm install

      # The tests run on the assembled dist/ (wasm artifacts + src/js/), and the wasm
      # artifacts are not in git. They are not built here either: a build is a full OpenCV
      # compile in Docker, too slow to repeat for every Node version on every push.
      #
      # Instead this takes them from a successful build-wasm.yml run whose artifact names
      # carry the fingerprint of the current build inputs (build/fingerprint.sh), so a test
      # never runs on artifacts built from different inputs — another branch, or a commit
      # before the Dockerfile, a patch or the whitelist changed. Both variants come from the
      # same run; build-wasm.yml uses fail-fast: false, so a "success" run means all three
      # variants built and passed their smoke tests. The single-file variant is not needed:
      # it is not part of the npm package.
      #
      # Only artifacts uploaded by this repository's own build-wasm.yml count, from a run
      # that only collaborators can start (workflow_dispatch, or a pushed tag). Artifact
      # names are not a trust boundary: a pull_request run executes the PR's copy of the
      # workflow files, so a pull request — from a fork in particular — could upload an
      # artifact under the same name, and CI would then test its wasm.
      #
      # When no such run exists (the inputs just changed, or the 30-day retention expired)
      # this step fails loudly instead of letting the tests run on nothing. Run
      # build-wasm.yml (workflow_dispatch) on the branch, then re-run this job.
      - name: Fetch the wasm artifacts built from these build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fp=$(build/fingerprint.sh)
          run_id=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=opencv-wasm-baseline-${fp}&per_page=20" \
                        --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id'); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '[.conclusion, .path, .event, .head_repository.full_name] | join(" ")')
            case "$run" in
              "success .github/workflows/build-wasm.yml workflow_dispatch ${GITHUB_REPOSITORY}" | \
              "success .github/workflows/build-wasm.yml push ${GITHUB_REPOSITORY}")
                run_id=$id
                break
                ;;
            esac
          done
          if [ -z "$run_id" ]; then
            echo "::error::No successful run of this repository's build-wasm.yml (workflow_dispatch or tag push) has artifacts for build inputs ${fp}. Run build-wasm.yml on this branch (workflow_dispatch), then re-run this job."
            exit 1
          fi
          echo "Using the artifacts of build-wasm run #${run_id} (build inputs ${fp})"
          gh run download "$run_id" --name "opencv-wasm-baseline-${fp}" --dir build/out/baseline
          gh run download "$run_id" --name "opencv-wasm-simd-${fp}" --dir build/out/simd
          ls -la build/out/baseline build/out/simd

      - name: Assemble dist/
        env:
          # A missing simd artifact fails instead of warning: this pipeline is supposed to
          # have both variants, and a baseline-only dist/ that still reports green would be
          # a lying green light.
          OPENCV_REQUIRE_SIMD: "1"
        run: npm run assemble

      # The same assertions run on both variants; this is the main guarantee that the SIMD
      # build computes correctly. OPENCV_SIMD forces the variant, and dist/index.js throws
      # when a variant named explicitly is missing instead of quietly falling back —
      # otherwise "run everything with forced SIMD" might test baseline.
      - name: Test (forced baseline) + variant parity
        env:
          OPENCV_SIMD: "0"
          # The parity test skips when dist/simd/ is missing; here it must really run.
          # Once is enough, so it is set on this step only: it loads both variants in
          # child processes, whatever the outer OPENCV_SIMD says.
          OPENCV_PARITY_REQUIRED: "1"
        run: npm test

      - name: Test (forced simd)
        env:
          OPENCV_SIMD: "1"
        run: npm test

      - name: Performance gates
        # On one Node version only, so CI runner jitter cannot cause false alarms.
        # Pinned to baseline: both gates compare the implementation under test with a
        # reference in the same process, which holds on either variant, but pinning one
        # keeps the absolute times printed by successive runs comparable.
        if: matrix.node == '24'
        env:
          OPENCV_SIMD: "0"
        run: npm run bench
